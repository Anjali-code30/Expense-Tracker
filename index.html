<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
<link rel="styleSheet" href="style.css"/>
</head>
<body>
    <div class="container">
        <h1 id="heading">Expense Tracker</h1>
    <div class="balance-container">
            <h2>Your Balance</h2>
            <h1 id="rupess">Rs. 0.00</h1>
        <div class="summary">
            <div class="income">
                <h3>Income</h3>
                 <p class="income-Amount">Rs.0.00</p>
            </div>
            <div class="expense">
               <h3>Expenses</h3>
                <p class="expense-Amount">Rs. 0.00</p> 
          </div>
     </div>   
    </div>

    <div class="main-content">
    <div class="transaction-container">
        <h2>Transictions</h2>
        <ul id="transaction-list">  
               
        </ul>
    </div>
    <div class="form-container">
    <form class="form">
        <h2>Add Transaction</h2>
        <div class="form-group">
        <label for="descri">Description</label>
        <input type="text" placeholder="enter description..." id="descri"/>
        </div>

        <div class="form-group">
         <label for="amount">Amount</label>
        <input type="number" placeholder="Enter amount..." id="amount"/>
        <small>Use negative (-) for expenses</small>
        </div>

        <button type="submit" id="btn">Add Transaction</button>

    </form>
    </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
